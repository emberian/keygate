[workspace]
resolver = "2"
members = ["crates/keygate-core", "crates/keygate-broker", "crates/keygate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
keygate-core = { path = "crates/keygate-core" }
keygate-broker = { path = "crates/keygate-broker" }

base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
rustix = { version = "1", features = ["process", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = "0.8"
url = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
